name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated CI environment
        run: cp .env.example .env
      - name: Integration and unit tests in Docker
        run: docker compose --profile test run --build --rm tests
      - name: Type check
        run: docker compose --profile test run --rm tests npm run check
      - name: Production image
        run: docker build --target production -t aulanexo-production .
      - name: Audit runtime dependencies
        run: docker run --rm aulanexo-production npm audit --omit=dev --audit-level=moderate
      - name: Clean up
        if: always()
        run: docker compose --profile test down -v
